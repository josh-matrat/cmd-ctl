[workspace]
resolver = "2"
default-members = ["crates/cmdctl-app"]
members = [
    "crates/cmdctl-terminal",
    "crates/cmdctl-daemon",
    "crates/cmdctl-renderer",
    "crates/cmdctl-input",
    "crates/cmdctl-tickets",
    "crates/cmdctl-knowledge",
    "crates/cmdctl-app",
    "crates/cmdctl-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
description = "GPU-accelerated terminal emulator and AI agent orchestrator for macOS"
repository = "https://github.com/joshrutkowski/cmd-ctl"
homepage = "https://github.com/joshrutkowski/cmd-ctl"

[workspace.dependencies]
# Internal crates
cmdctl-terminal = { path = "crates/cmdctl-terminal" }
cmdctl-daemon = { path = "crates/cmdctl-daemon" }
cmdctl-renderer = { path = "crates/cmdctl-renderer" }
cmdctl-input = { path = "crates/cmdctl-input" }
cmdctl-tickets = { path = "crates/cmdctl-tickets" }
cmdctl-knowledge = { path = "crates/cmdctl-knowledge" }

# Terminal emulation
alacritty_terminal = "0.25"

# Rendering
metal = "0.33"
core-graphics = "0.24"
core-text = "21"
objc2 = "0.6"
foreign-types = "0.5"

# Windowing
winit = "0.30"
raw-window-handle = "0.6"

# Session management
rusqlite = { version = "0.39", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
bincode = "1"
toml = "0.8"

# Utilities
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
parking_lot = "0.12"

[profile.release]
lto = "thin"
opt-level = 3
